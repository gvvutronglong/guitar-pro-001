<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Go Tell Aunt Rhody</title>
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.css">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }
    #alphaTabContainer { padding: 10px; }
    .at-controls { background: #f0f0f0; padding: 10px; }
  </style>
</head>
<body>
  <div id="alphaTabContainer">
    <div class="at-controls"></div>
    <div id="alphaTab"></div>
  </div>

  <script>
    const api = new alphaTab.AlphaTabApi(document.querySelector("#alphaTab"), {
      file: "Lv01-CI41.85-Go-Tell-Aunt-Rhody-Jean-Jacques-Rousseau-v1.gp",
      player: {
        enablePlayer: true,
        enableLoop: true,
        soundFont: "https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/soundfont/sonivox.sf2"
      },
      display: {
        layoutMode: "page"
      },
      rendering: {
        engine: "svg"
      }
    });

    new alphaTab.controls.PlayerControls(api, document.querySelector(".at-controls"));
  </script>
</body>
</html>
